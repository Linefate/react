<html>

<body>
    <script src="./umd/react.18.2.development.js"></script>
    <script src="./umd/react-dom.18.2.development.js"></script>
    <script src="./umd/babel.js"></script>
    <div id="app"></div>
    <meta charset="UTF-8">
    <script type="text/babel">
        debugger
        function Link() {
            return <a href="https://qianqian.com">qianqian.dev</a>
        }
        function App() {
            const [count, setCount] = React.useState(0)
            return (
                <div>
                    <p>
                        <Link />
                        <br />
                        <button onClick={() => setCount(count => count + 1)}>click me - {count}</button>
                    </p>
                </div>
            );
        }

        const container = document.getElementById('app');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>

</html>
