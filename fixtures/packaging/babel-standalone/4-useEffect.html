<html>

</html>

<body>
    <script src="./umd/react.18.2.development.js"></script>
    <script src="./umd/react-dom.18.2.development.js"></script>
    <script src="./umd/babel.js"></script>
    <div id="app"></div>
    <script type="text/babel">
        // docs: https://jser.dev/2023-07-08-how-does-useeffect-work
        function Link({ count }) {
            React.useEffect(() => {
                console.log('useEffect  link2');
            }, []);
            React.useEffect(() => {
                console.log('useEffect  link1');
            }, []);
            React.useEffect(() => {
                console.log('useEffect  link3');
            }, []);

            React.useEffect(() => {
                console.log('useEffect link deps count', count);
                return () => {
                    console.log('useEffect link deps count --- clear');
                };
            }, [count]);

            React.useLayoutEffect(() => {
                console.log('useLayoutEffect link');
            }, []);

            return <a href="https://qianqian.com">qianqian.dev</a>
        }
        function App() {
            const [count, setCount] = React.useState(234)
            React.useEffect(() => {
                console.log('useEffect no setState');
            }, []);

            React.useLayoutEffect(() => {
                console.log('useLayoutEffect');
            }, []);

            React.useEffect(() => {
                console.log('useEffect setState');
                setCount((count) => {
                    console.log("set State ----")
                    return count + 1
                });
            }, []);
            return (
                <div>
                    <p>
                        <div>123</div>
                        <Link count={count} />
                        <button onClick={() => setCount(count => count + 1)}>click me - {count}</button>
                    </p>
                </div>
            );
        }





        const container = document.getElementById('app');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>

</html>
