<html>

<body>
    <script src="../umd/react.18.2.development.js"></script>
    <script src="../umd/react-dom.18.2.development.js"></script>
    <script src="../umd/babel.js"></script>
    <div id="app"></div>
    <meta charset="UTF-8">
    <script type="text/babel">
        // docs: https://jser.dev/2023-07-11-overall-of-react-internals
        function App() {
            const [count, setCount] = React.useState(0);
            debugger
            React.useEffect(() => {
                debugger
                console.log('useEffect');
                setCount(count + 1);
            }, []);
            return <h1>hello world {count}</h1>
        }

        const container = document.getElementById('app');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>

</html>
